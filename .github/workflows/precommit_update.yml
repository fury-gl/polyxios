name: Pre-commit auto-update

on:
  schedule:
    - cron: "0 2 * * Mon"  # weekly
  workflow_dispatch:

jobs:
  auto-update:
    if: github.repository_owner == 'fury-gl'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0

      - uses: browniebroke/pre-commit-autoupdate-action@f5c3ec85103b9f8f9be60b9c006cec763d2bdd02  # v1.0.1

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/pre-commit-hooks
          title: "MNT: update pre-commit hooks"
          commit-message: "MNT: update pre-commit hooks"
          body: Update versions of pre-commit hooks to latest.
