name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (use *-test suffix to skip PyPI)'
        required: true
        default: 'v0.0.0-test'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299  # v4.3.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  github_release:
    name: GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Extract changelog section
        id: changelog
        run: |
          python - <<'EOF'
          import re, os, sys
          tag = os.environ["TAG"].lstrip("v")
          try:
              with open("CHANGES.rst") as f:
                  content = f.read()
              pattern = rf"(?ms)^{re.escape(tag)}[^\n]*\n[-]+\n(.*?)(?=\n\S[^\n]*\n[-]+|\Z)"
              m = re.search(pattern, content)
              notes = m.group(1).strip() if m else ""
          except Exception:
              notes = ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              print(f"notes<<EOF_NOTES\n{notes}\nEOF_NOTES", file=fh)
          EOF
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never interpolated into the script: the
          # notes are reStructuredText and every ``literal`` in them would be
          # command substitution inside a double-quoted shell string.
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n\n---\n' "$NOTES" > release_notes.md
            gh release create "${{ env.RELEASE_TAG }}" \
              dist/* \
              --title "polyxios ${{ env.RELEASE_TAG }}" \
              --notes-file release_notes.md \
              --generate-notes
          else
            gh release create "${{ env.RELEASE_TAG }}" \
              dist/* \
              --title "polyxios ${{ env.RELEASE_TAG }}" \
              --generate-notes
          fi

  publish_pypi:
    name: PyPI
    needs: [github_release]
    # Trusted publishing is bound to fury-gl/polyxios: a tag pushed to a fork
    # still builds and drafts its GitHub release, but never reaches PyPI.
    if: >-
      github.repository == 'fury-gl/polyxios'
      && !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'test')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polyxios/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
