name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 2 * * Mon"  # weekly

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    if: github.event_name != 'schedule' || github.repository_owner == 'fury-gl'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # h5py, lazrs and PyYAML (through pre-commit in dev) publish no cp315
        # wheels yet, and none builds under --no-build-isolation. The tests
        # need only pytest from dev; the HDF5 and LAZ ones importorskip, so
        # these rows do not run them.
        # TODO: drop this include once h5py, lazrs and PyYAML ship cp315 wheels.
        include:
          - python-version: "3.15"
            extras: "netcdf"
            extra-packages: "pytest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "CC=clang" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "meson-python>=0.15" "Cython>=3.0" "numpy>=1.24" meson ninja

      - name: Install polyxios
        run: pip install --no-build-isolation -e ".[${{ matrix.extras || 'dev,hdf5,netcdf,laz' }}]" ${{ matrix.extra-packages }}

      - name: Run tests
        run: pytest tests/ -v --durations=10

  # The comparison readers are never a polyxios dependency - the library is
  # numpy and nothing else, and a user installing it gets no C++ toolkit. They
  # are installed here alone, so the guards that hold a codec to another
  # implementation run somewhere rather than skipping everywhere.
  interop:
    name: Interop (vtk, meshio)
    if: github.event_name != 'schedule' || github.repository_owner == 'fury-gl'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "meson-python>=0.15" "Cython>=3.0" "numpy>=1.24" meson ninja

      - name: Install polyxios
        run: pip install --no-build-isolation -e ".[dev]"

      - name: Install the comparison readers
        run: pip install vtk meshio pycollada

      - name: Check they are importable
        # Every guard that uses them is importorskip'd, so a failed install
        # would leave this job green over tests that never ran.
        run: |
          python -c "import vtkmodules.vtkIOLegacy, vtkmodules.vtkCommonCore"
          python -c "import vtkmodules.util.numpy_support"
          python -c "import meshio, meshio.netgen._netgen"
          python -c "import collada"

      - name: Run tests
        run: pytest tests/ -v --durations=10
