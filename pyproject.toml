[build-system]
requires = ["meson-python>=0.15", "Cython>=3.0", "numpy>=1.24", "meson", "ninja"]
build-backend = "mesonpy"

[project]
name = "polyxios"
version = "0.3.0.dev0"
description = "Fast 3D file format I/O and processing library"
readme = "README.md"
requires-python = ">=3.11"
license.file = "LICENSE"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mypy",
    "cython>=3.0",
    "pre-commit",
    "spin",
    "ruff",
    "codespell",
]
doc = [
    "sphinx",
    "numpydoc",
    "sphinx-gallery",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxext-opengraph[social-cards]",
    "sphinx-sitemap",
]
viz = [
    "fury>=2",
]

[project.scripts]
pxios = "polyxios.cli:main"

[project.entry-points."polyxios.codecs"]
# third-party packages register their own entry points here

[tool.spin]
package = "polyxios"

[tool.spin.commands]
"Setup" = [".spin/cmds.py:setup"]
"Build" = ["spin.cmds.meson.build", ".spin/cmds.py:install"]
"Test" = [".spin/cmds.py:test", ".spin/cmds.py:lint"]
"Docs" = [".spin/cmds.py:docs"]
"Clean" = [".spin/cmds.py:clean"]
"Release" = [".spin/cmds.py:release"]

[tool.pytest.ini_options]
addopts = "--durations=10 -v"
testpaths = ["tests"]
markers = [
    "network: downloads assets from the remote data catalog (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 88
target-version = "py311"
force-exclude = true
extend-exclude = ["__pycache__", "build", "docs/"]

[tool.ruff.lint]
# Explicit selection: ruff >= 0.16 widened its default rule set considerably,
# so rely on `select` rather than `extend-select` to keep the set stable.
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "UP", "W", "PERF"]
ignore = ["B905", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["polyxios"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"

[tool.codespell]
# 'domin domout' is the Netgen .vol surface-element column header, spelled that
# way by the format. Scoped to the pair so a bare 'domin' is still a typo.
ignore-regex = 'domin\s+domout'

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = ["pp*", "*-musllinux_*", "*-win32"]

[tool.cibuildwheel.macos]
before-all = "curl -fsSL https://github.com/dipy/dipy_data/releases/download/v0.1/libomp-19.1.5-darwin20.tar.gz | sudo tar xz -C /"
environment = {CC = "clang", MACOSX_DEPLOYMENT_TARGET = "11.0"}
